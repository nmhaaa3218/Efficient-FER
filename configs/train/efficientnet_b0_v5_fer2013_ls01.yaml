aug:
  cutmix_alpha: 1.0
  cutmix_prob: 0.5
  flip_prob: 0.5
  mixup_alpha: 0.4
  rotation_deg: 10.0
  variant: v5
data:
  image_size: 48
  in_channels: 1
  label_mode: hard
  name: fer2013
  root: data
ensemble:
  enabled: false
model:
  in_channels: 1
  name: efficientnet_b0
  num_classes: 7
  pretrained: true
train:
  batch_size: 64
  device: auto
  epochs: 30
  label_smoothing: 0.1
  lr: 0.001
  num_seeds: 3
  num_workers: 0
  optimizer: adamw
  output_dir: runs
  scheduler: onecycle
  seed: 42
  weight_decay: 0.0001
