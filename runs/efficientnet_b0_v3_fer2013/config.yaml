aug:
  color_brightness: 0.2
  color_contrast: 0.2
  crop_padding: 4
  flip_prob: 0.5
  rotation_deg: 10.0
  variant: v3
data:
  image_size: 48
  in_channels: 1
  label_mode: hard
  name: fer2013
  root: data
ensemble:
  enabled: false
model:
  eca: false
  in_channels: 1
  name: efficientnet_b0
  num_classes: 7
  pretrained: true
train:
  batch_size: 64
  device: auto
  epochs: 300
  label_smoothing: 0.1
  lr: 0.001
  num_seeds: 3
  num_workers: 0
  optimizer: adamw
  output_dir: runs
  scheduler: onecycle
  seed: 42
  weight_decay: 0.1
  grad_clip: 2.0
