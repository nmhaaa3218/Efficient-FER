aug:
  crop_padding: 4
  flip_prob: 0.5
  rotation_deg: 10.0
  variant: v2
data:
  image_size: 48
  in_channels: 1
  label_mode: hard
  name: fer2013
  root: data
ensemble:
  enabled: false
model:
  in_channels: 1
  name: efficientnet_b0
  num_classes: 7
  pretrained: true
train:
  batch_size: 64
  class_weighted_loss: true
  device: auto
  epochs: 30
  lr: 0.001
  num_seeds: 3
  num_workers: 0
  optimizer: adamw
  output_dir: runs
  sampler: weighted
  scheduler: onecycle
  seed: 42
  weight_decay: 0.0001
